services:
  dev:
    image: rust:1.87-slim
    env_file:
      - .env
    volumes:
      - .:/usr/src/linkify
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/linkify/target
    working_dir: /usr/src/linkify
    command: bash
    tty: true

volumes:
  cargo-cache:
  target-cache: